name: Build and deploy MINA EAR

on:
  workflow_dispatch:
    inputs:
      project:
        description: Path to the Studio .mpackage or JSON in Git
        type: string
        required: true
        default: scripts/ci/fixtures/ear-qa.json
      environment:
        description: MINA profile and matching GitHub deployment environment
        type: choice
        options:
          - qa
          - production
        default: qa
      deploy:
        description: Start a Linux deployment after building the artifact
        type: boolean
        default: false
      temporary_qa:
        description: Test the synthetic EAR on a disposable Ubuntu runner
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Require the synthetic project for temporary QA
        if: ${{ inputs.temporary_qa && (inputs.deploy || inputs.environment != 'qa' || inputs.project != 'scripts/ci/fixtures/ear-qa.json') }}
        run: |
          echo 'Choose the synthetic project, qa, and deploy off when using temporary_qa.' >&2
          exit 1
      - name: Require a protected ref for deployment
        if: ${{ inputs.deploy && !github.ref_protected }}
        run: |
          echo 'Choose a protected branch or tag to deploy.' >&2
          exit 1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install MINA packaging dependencies
        shell: bash
        run: |
          sed '/^[[:space:]]*ibm-db[<=>!~]/d' backend/requirements.txt > "$RUNNER_TEMP/mina-requirements.txt"
          python -m pip install -r "$RUNNER_TEMP/mina-requirements.txt"
          python -m pip check
      - name: Build the EAR and checksum
        shell: bash
        env:
          MINA_PROJECT: ${{ inputs.project }}
          MINA_PROFILE: ${{ inputs.environment }}
          MINA_DATA_DIR: ${{ runner.temp }}/mina-build
        run: |
          python scripts/ci/build-ear.py --environment "$MINA_PROFILE" \
            --version "$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT" --output-dir dist/ear -- "$MINA_PROJECT"
          cd dist/ear
          sha256sum -- *.ear > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mina-ear
          path: dist/ear
          if-no-files-found: error
          overwrite: true

  temporary-qa:
    if: inputs.temporary_qa
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mina-ear
          path: dist/ear
      - name: Install temporary QA runtime dependencies
        run: |
          sed '/^[[:space:]]*ibm-db[<=>!~]/d' backend/requirements.txt > "$RUNNER_TEMP/mina-requirements.txt"
          python -m pip install -r "$RUNNER_TEMP/mina-requirements.txt" -r administrator/requirements.txt
          python -m pip check
      - name: Deploy the EAR and test the authenticated flow
        run: python scripts/ci/smoke-ear.py dist/ear

  deploy:
    if: inputs.deploy && github.ref_protected
    needs: build
    runs-on: [self-hosted, Linux, mina-deploy]
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    concurrency:
      group: mina-ear-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mina-ear
          path: dist/ear
      - name: Deploy through the Linux Control Plane
        shell: bash
        env:
          MINA_PROFILE: ${{ inputs.environment }}
          MINA_CONTROL_PLANE_URL: ${{ vars.MINA_CONTROL_PLANE_URL }}
          MINA_DATA_PLANE: ${{ vars.MINA_DATA_PLANE }}
          MINA_CAPABILITY_ID: ${{ vars.MINA_CAPABILITY_ID }}
          MINA_NAMESPACE: ${{ vars.MINA_NAMESPACE }}
          MINA_TEAM_ID: ${{ vars.MINA_TEAM_ID }}
          MINA_CONTROL_PLANE_KEY: ${{ secrets.MINA_CONTROL_PLANE_KEY }}
          MINA_DEPLOYMENT_SECRETS_JSON: ${{ secrets.MINA_DEPLOYMENT_SECRETS_JSON }}
        run: bash scripts/ci/deploy-ear.sh dist/ear "$MINA_PROFILE"
