# One private INI per Data Plane. No Control Plane server is installed by this file.
[setup]
install_root=/opt/mina
source_root=/opt/mina/software
python=python3.12
version=1.0.5
pip_index_url=
wheelhouse=
start=true

[control-plane]
control_plane_url=https://control-plane.example.com
admin_key=CHANGE_ME_OWNER_KEY
# Optional PEM CA bundle for your internal HTTPS server; verification stays enabled.
ca_bundle=

[data-plane]
id=customer-plane
name=Customer Data Plane
host=customer-runtime.example.com
type=on-premises
region=local
namespace=customer
agent_version=1.0.0
heartbeat_seconds=30
available_capacity=20
# Empty derives /opt/mina/agent/<id>; separate planes never share state.
state_dir=
capability_name=Integration Runtime

[runtime]
driver_home=/opt/mina/drivers
java_bridge_home=/opt/mina/software/java-bridge/build
java=
build_java_bridge=false
install_db2=false

# Optional. Leave id blank to manage teams/users from the Control Plane UI.
[delivery-team]
id=
name=
description=
# Leave empty to add this plane/namespace to the team's existing scopes.
# A nonempty JSON array replaces the team's complete scope list.
scopes_json=

[user]
id=
name=
team_id=
role=Application Manager
scope=namespace
resource_id=
