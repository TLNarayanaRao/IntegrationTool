# Edit your private copy under /opt/mina/config. Values need no quotes.
[setup]
install_root=/opt/mina
source_root=/opt/mina/software
python=python3.12
version=1.0.5
build_administrator=true
administrator_archive=
pip_index_url=
wheelhouse=
start=true

[control-plane]
host=0.0.0.0
port=19080
api_key=CHANGE_ME_OWNER_KEY
secret_key=CHANGE_ME_STABLE_ENCRYPTION_KEY
install_local_runtime=false

[runtime]
driver_home=/opt/mina/drivers
java_bridge_home=/opt/mina/software/java-bridge/build
build_java_bridge=false
install_db2=false
