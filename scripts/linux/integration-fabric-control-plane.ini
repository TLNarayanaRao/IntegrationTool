# MINA Control Plane Linux configuration.
# Keep this file readable only by the account that runs the Control Plane.

[control-plane]
host=pho-tibwapp-d03.ssg.petsmart.com
port=19080
home=/opt/tibco/esb/IntegrationFabricSoftware/control-plane
data_dir=/opt/tibco/esb/IntegrationFabricSoftware/control-plane-data
log_dir=/opt/tibco/esb/IntegrationFabricSoftware/logs/control-plane
pid_dir=/opt/tibco/esb/IntegrationFabricSoftware/run
api_key=dev-api-key-if
secret_key=dev-api-key-if
runtime_command=/opt/tibco/esb/IntegrationFabricSoftware/runtime/integration-fabric-runtime --application {application} --environment {environment}
control_plane_url=http://pho-tibwapp-d03:19080
admin_key=dev-api-key-if

[runtime]
data_dir=/opt/tibco/esb/IntegrationFabricSoftware/runtime/data
log_dir=/opt/tibco/esb/IntegrationFabricSoftware/logs/runtime
driver_home=/opt/tibco/esb/IntegrationFabricSoftware/drivers

[data-plane]
id=customer-data-delivery-plane
name=Customer Data Plane
namespace=EDDCustomer
agent_version=1.0.0
heartbeat_seconds=30
available_capacity=50

[delivery-team]
id=customer-data
name=Customer Data Delivery
description=Customer data integration team
scopes_json=[{"dataPlaneId":"customer-data-delivery-plane","namespace":"EDDCustomer"}]

[data-teams]
Customer=EDDCustomer
#Sales=EDDSalesFinLPA
#Merch=BDDMerchPB
#Supplychain=BDDDigitalSC
#StoreSvc=BDDStoreSvcsRE

[user]
id=customer-user
name=Customer Application Manager
team_id=customer-data
role=Application Manager
scope=namespace
resource_id=EDDCustomer

[setup]
version=1.0.0
