# Integration Fabric Control Plane Linux configuration.
# Keep this file readable only by the account that runs the Control Plane.

[control-plane]
host=pho-tibwapp-d03.ssg.petsmart.com
port=19080
home=/opt/tibco/esb/integrationfabric/control-plane
data_dir=/opt/tibco/esb/integrationfabric/control-plane-data
log_dir=/opt/tibco/esb/integrationfabric/logs/control-plane
pid_dir=/opt/tibco/esb/integrationfabric/run
api_key=dev-api-key-if
secret_key=dev-api-key-if
runtime_command=/opt/tibco/esb/integrationfabric/runtime/integration-fabric-runtime --application {application} --environment {environment}

[runtime]
data_dir=/opt/tibco/esb/integrationfabric/runtime/data
log_dir=/opt/tibco/esb/integrationfabric/logs/runtime
driver_home=/opt/tibco/esb/integrationfabric/source/drivers
