apiVersion: v1
kind: ServiceAccount
metadata:
  name: mina-python-agent
  namespace: mina
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mina-python-agent
  namespace: mina
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mina-python-agent
  namespace: mina
subjects:
  - kind: ServiceAccount
    name: mina-python-agent
    namespace: mina
roleRef:
  kind: Role
  name: mina-python-agent
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mina-python-agent
  namespace: mina
spec:
  replicas: 1
  selector:
    matchLabels: {app: mina-python-agent}
  template:
    metadata:
      labels: {app: mina-python-agent}
    spec:
      serviceAccountName: mina-python-agent
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      containers:
        - name: agent
          image: mina-python-agent:latest
          env:
            - {name: MINA_AGENT_MODE, value: kubernetes}
            - {name: MINA_AGENT_NAMESPACES, value: mina}
            - {name: MINA_DATA_PLANE_ID, value: python-kubernetes}
            - {name: MINA_CONTROL_PLANE_URL, value: https://control-plane.example.com}
            - {name: MINA_PYTHON_RUNTIME_IMAGE, value: mina-python-agent:latest}
            - name: MINA_AGENT_KEY
              valueFrom:
                secretKeyRef: {name: mina-agent-credentials, key: control-plane-key}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
