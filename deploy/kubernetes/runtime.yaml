apiVersion: apps/v1
kind: Deployment
metadata:
  name: mina-runtime
  namespace: mina
spec:
  replicas: 2
  selector:
    matchLabels: { app: mina-runtime }
  template:
    metadata:
      labels: { app: mina-runtime }
    spec:
      containers:
        - name: runtime
          image: mina:0.1.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8787}]
          readinessProbe: {httpGet: {path: /api/health, port: 8787}, initialDelaySeconds: 5}
          livenessProbe: {httpGet: {path: /api/health, port: 8787}, initialDelaySeconds: 15}
          volumeMounts: [{name: data, mountPath: /app/backend/data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: mina-runtime
  namespace: mina
spec:
  selector: {app: mina-runtime}
  ports: [{port: 80, targetPort: 8787}]
