<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'">
<title>Starting MINA Studio</title>
<style>
  html { color-scheme: dark; font: 16px "Segoe UI", sans-serif; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #071522; color: #e2f3fb; }
  main { margin: 1rem; text-align: center; }
  img { width: 60px; height: 60px; }
  h1 { font-size: 1.4rem; margin: 1rem 0 .45rem; }
  p { color: #a2bfce; margin: 0 0 1.2rem; }
  progress { width: min(100%, 11rem); height: .5rem; accent-color: #39c6e7; }
</style>
<main aria-labelledby="title">
  <img src="mina-icon.svg" alt="">
  <h1 id="title">Starting MINA Studio</h1>
  <p>The local runtime is getting ready.</p>
  <progress aria-label="Starting the local runtime"></progress>
</main>
</html>
