    <text x="128" y="147" fill="#fff" stroke="#fff" stroke-width="1" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="57" font-weight="800" letter-spacing="-1" filter="url(#textShadow)">End</text>
