    <path fill="url(#face)" stroke="#fff" stroke-width="6" d="M84 25h88l59 59v88l-59 59H84l-59-59V84z"/>
    <path fill="none" stroke="#ff95a0" stroke-opacity=".72" stroke-width="3" d="M88 36h80l52 52v80l-52 52H88l-52-52V88z"/>
