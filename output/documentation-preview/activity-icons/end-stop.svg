<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title description">
  <title id="title">End activity</title>
  <desc id="description">Glossy red stop-board icon with End written in the center</desc>
  <defs>
    <linearGradient id="face" x1="48" y1="30" x2="204" y2="226" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff6674"/>
      <stop offset=".32" stop-color="#ef253d"/>
      <stop offset=".72" stop-color="#b90825"/>
      <stop offset="1" stop-color="#710015"/>
    </linearGradient>
    <linearGradient id="rim" x1="58" y1="35" x2="197" y2="222" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffd9dc"/>
      <stop offset=".2" stop-color="#ff6571"/>
      <stop offset=".58" stop-color="#bf071f"/>
      <stop offset="1" stop-color="#5e0011"/>
    </linearGradient>
    <radialGradient id="shine" cx="0" cy="0" r="1" gradientTransform="translate(91 65) rotate(48) scale(116 72)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".7"/>
